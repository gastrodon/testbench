# Ender 3 / PLA slicing profile for the optics microscope focus mechanism
# (base_mount, carrier). Same machine/material as ../tele/print_profile.ini;
# settings differ because these parts are functional (sliding tube-in-sleeve
# bearing, printed thread, rack) rather than a light cosmetic nosepiece.
nozzle_diameter = 0.4
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
filament_diameter = 1.75
layer_height = 0.2
first_layer_height = 0.2

# Structural: carries the tube-in-sleeve bearing and (on the carrier) the
# rack. Heavier than tele's 3%/2-perimeter cosmetic settings.
fill_density = 20%
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4

# Both base_mount() and pcb_carrier_printable() are modelled self-supporting
# (params.scad taper angles, pcb_carrier.scad's own comment on why the
# thread prints up with no elephant foot) — no support material needed.
support_material = 0

# A prior print of a tall/narrow part on this profile got bumped and lost
# bed adhesion mid-print. Both base_mount and carrier are tall relative to
# their footprint (74.5mm/90mm tall, ~20-25mm footprint) — go wide on brim
# rather than chasing supports: these parts have no overhang for the
# slicer's support generator to trigger on (self-supporting by design), so
# ordinary "enable supports" produces nothing. Brim is the real lever for
# base-of-part adhesion/stiffness against a bump.
brim_width = 15
brim_separation_gap = 0.1
skirts = 1
temperature = 205
first_layer_temperature = 210
bed_temperature = 60
first_layer_bed_temperature = 60
filament_type = PLA
gcode_flavor = marlin
