# Minimal Ender 3 / PLA slicing profile for the EVA-319 nosepiece.
# Stock 0.4mm nozzle (optics/README.md), no supports needed — the design's
# own taper_angle (45 deg, params.scad) is the self-support floor.
nozzle_diameter = 0.4
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
filament_diameter = 1.75
layer_height = 0.2
first_layer_height = 0.2
# Not load-bearing (the nose only has to hold its own shape against
# hand pressure and the focuser's set screws) -- low infill is fine.
fill_density = 8%
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
support_material = 0
# The v1 print (boss-down, small 11.88mm bed footprint) needed this to
# clear a "low bed adhesion" warning. v2 (boss-down, nose_len=32, same
# small footprint but much taller/heavier) detached mid-print despite
# it -- the footprint was still the real problem, not the brim, which is
# why nosepiece.scad switched to nose-down (24.15mm footprint) instead
# of relying on a bigger brim to save a top-heavy orientation. Keeping
# the brim anyway as cheap insurance now that the base footprint itself
# is sound.
brim_width = 6
skirts = 1
temperature = 205
first_layer_temperature = 210
bed_temperature = 60
first_layer_bed_temperature = 60
filament_type = PLA
gcode_flavor = marlin
