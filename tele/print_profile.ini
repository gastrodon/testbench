# Minimal Ender 3 / PLA slicing profile for the EVA-319 nosepiece.
# Stock 0.4mm nozzle (optics/README.md), no supports needed — the design's
# own taper_angle (45 deg, params.scad) is the self-support floor.
nozzle_diameter = 0.4
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
filament_diameter = 1.75
layer_height = 0.2
first_layer_height = 0.2
fill_density = 20%
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
support_material = 0
# Boss (11.88mm dia) is the only bed contact for a 26mm-tall, 30.65mm-wide
# part — PrusaSlicer flags "low bed adhesion" on this footprint without
# help. A brim (this is the only object on the plate, so plate-wide brim
# settings apply cleanly here) fixes exactly this without touching the
# design itself.
brim_width = 6
skirts = 1
temperature = 205
first_layer_temperature = 210
bed_temperature = 60
first_layer_bed_temperature = 60
filament_type = PLA
gcode_flavor = marlin
